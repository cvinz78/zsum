<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1522"/>
      <stop offset="0.55" stop-color="#101b2c"/>
      <stop offset="1" stop-color="#0c1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4a0"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="320" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1278" height="318" rx="21" fill="none" stroke="#2a3a52" stroke-width="2"/>
  <rect x="1" y="1" width="1278" height="150" rx="21" fill="url(#fade)"/>

  <!-- faint hash strings -->
  <g font-family="Adwaita Mono, monospace" font-size="15" fill="#7d93b3">
    <text x="36"  y="56"  opacity="0.16">a3f9c1e7b2d4805691acff0d3e7b21c4</text>
    <text x="560" y="300" opacity="0.12" font-size="14">sha256 · blake2 · crc32 · md5 · sha512</text>
  </g>

  <!-- ============ left: title block ============ -->
  <text x="60" y="140" font-family="Adwaita Mono, monospace" font-size="100" font-weight="bold" letter-spacing="2" fill="#f0f6fc">zsum</text>
  <rect x="62" y="164" width="240" height="6" rx="3" fill="url(#accent)"/>

  <g font-family="Adwaita Sans, sans-serif" font-size="26" fill="#a9c0dd">
    <text x="62" y="212">Prüfsummen erstellen &amp; prüfen</text>
    <text x="62" y="244" fill="#7d93b3" font-size="22">Create &amp; verify checksums</text>
  </g>

  <!-- platform pills -->
  <g font-family="Adwaita Sans, sans-serif" font-size="20" font-weight="bold">
    <rect x="62" y="262" width="186" height="42" rx="21" fill="#16263c" stroke="#2dd4a0" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(86,283)">
      <rect x="-12" y="-10" width="24" height="20" rx="5" fill="none" stroke="#2dd4a0" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="Adwaita Mono, monospace" font-size="14" font-weight="bold" fill="#2dd4a0">&gt;_</text>
    </g>
    <text x="114" y="290" fill="#dce8f7">Linux</text>

    <rect x="264" y="262" width="196" height="42" rx="21" fill="#16263c" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="1.5"/>
    <g transform="translate(290,283)" fill="#3b82f6">
      <rect x="-10" y="-10" width="9" height="9"/>
      <rect x="1"  y="-10" width="9" height="9"/>
      <rect x="-10" y="1"  width="9" height="9"/>
      <rect x="1"  y="1"  width="9" height="9"/>
    </g>
    <text x="312" y="290" fill="#dce8f7">Windows</text>
  </g>

  <!-- ============ right: terminal card ============ -->
  <g>
    <rect x="700" y="44" width="530" height="232" rx="14" fill="#0a1018" stroke="#2a3a52" stroke-width="1.5"/>
    <path d="M 700 58 a 14 14 0 0 1 14 -14 h 502 a 14 14 0 0 1 14 14 v 22 h -530 z" fill="#131c2b"/>
    <line x1="700" y1="80" x2="1230" y2="80" stroke="#2a3a52" stroke-width="1.5"/>
    <circle cx="722" cy="61" r="6" fill="#ff5f57"/>
    <circle cx="742" cy="61" r="6" fill="#febc2e"/>
    <circle cx="762" cy="61" r="6" fill="#28c840"/>

    <g font-family="Adwaita Mono, monospace" font-size="17">
      <text x="720" y="110" fill="#e6eef8">zsum Musik pruefung.txt</text>

      <text x="720" y="146" fill="#9fb3cc">"Song 01.mp3" = 8f3a91c2d4e5…</text>
      <text x="1210" y="146" text-anchor="end" font-weight="bold" fill="#2dd4a0">[OK]</text>

      <text x="720" y="178" fill="#9fb3cc">"Song 02.mp3" = 44d97b0e6a1f…</text>
      <text x="1210" y="178" text-anchor="end" font-weight="bold" fill="#2dd4a0">[OK]</text>

      <text x="720" y="210" fill="#9fb3cc">"Backup.iso" = 9e1078f2d6c5…</text>
      <text x="1210" y="210" text-anchor="end" font-weight="bold" fill="#f85149">[FAIL]</text>

      <text x="720" y="248" fill="#5c718c" font-size="15">3 Dateien · sha256 automatisch erkannt</text>
    </g>
  </g>
</svg>
